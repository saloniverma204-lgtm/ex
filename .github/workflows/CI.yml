name: ML CI pipeline
on: 
  push:
    branches:[main]
  workflow_dispatch:

jobs:
  train-and-test:
   runs-on: ubuntu-latest
   steps:
    - name: Download project code
      uses: actions/checkout@v4
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
    - name: Install libraries
      run: pip install -r requirements.txt
    - name: Train ML Model
      run: python train.py
    - name: Test ML Model
      run: python test.py  
